arquivo:
  diretorio-upload: /app/storage

server:
  port: 8082
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: sgu-prae-service

  web:
    locale-resolver: fixed
    locale: pt_BR

  devtools:
    livereload:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  # Banco de Dados: Preparado para injeção via variáveis de ambiente
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prae}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:password}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    create-schemas: true
    default-schema: public

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
        default-requeue-rejected: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

springdoc:
  api-docs:
    path: /api-doc/docs
  swagger-ui:
    path: /api-doc/swagger.html

# Configuração Base do Keycloak
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:9090}
  realm: ${KEYCLOAK_REALM:sgu-ufape}
  client-id: ${KEYCLOAK_CLIENT_ID:sgu-application}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:HntTWny9OT0d3sCBc9qwc6asCNuHXY5e}

common:
  front: ${FRONTEND_URL:http://localhost:3000/, https://sgiufape.vercel.app/}
  emailEnabled: false

logging:
  level:
    org:
      springframework: DEBUG

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

---
# ==========================================
# PROFILE DOCKER (Para rodar no docker-compose)
# ==========================================
spring:
  config:
    activate:
      on-profile: docker

  rabbitmq:
    host: rabbitmq

  data:
    redis:
      host: redis

  datasource:
    url: jdbc:postgresql://prae-db:5432/prae

  # Opcional, pois no profile docker as propriedades padrão do flyway/jpa são herdadas
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

keycloak:
  # Na rede do Docker local o acesso é feito pelo nome do serviço e a porta interna
  auth-server-url: http://keycloak:8080