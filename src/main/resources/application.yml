arquivo:
  diretorio-upload: ${UPLOAD_DIR:/app/storage}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: sgu-prae-service

  profiles:
    # Se nenhuma variável SPRING_PROFILES_ACTIVE for definida, assume 'dev' para facilitar execução local na IDE
    active: ${SPRING_PROFILES_ACTIVE:dev}

  web:
    locale-resolver: fixed
    locale: pt_BR

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  data:
    redis:
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    create-schemas: true
    default-schema: public

  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2
        default-requeue-rejected: false

springdoc:
  api-docs:
    path: /api-doc/docs
  swagger-ui:
    path: /api-doc/swagger.html

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false
